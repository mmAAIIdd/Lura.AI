<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Lura связывает релизы, пользовательскую обратную связь и продуктовые метрики в проверяемую историю изменений продукта."
    />
    <!-- Matches .gh-brand-mark in index.css: white square, black wordmark. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffffff'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Arial,sans-serif' font-weight='900' font-size='38' fill='%23000000'%3EL%3C/text%3E%3C/svg%3E"
    />
    <title>Lura — анализ изменений продукта</title>
    <!--
      Resolve the theme before first paint. Running this in <head> — rather than
      from React — is what prevents the dark page flashing white (or the reverse)
      while the bundle loads. It always stamps an explicit value, so the
      stylesheet needs only two states instead of also handling "unset".
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('lura-theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          document.documentElement.dataset.theme = stored || (prefersLight ? 'light' : 'dark');
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
